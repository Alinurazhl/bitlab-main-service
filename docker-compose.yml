services:
  postgres_db:
    image: postgres:15-alpine
    container_name: bitlab_lms_db
    environment:
      POSTGRES_DB: lms_main_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms_main_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: bitlab_keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_db:5432/lms_main_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
    ports:
      - "8082:8080"
    depends_on:
      postgres_db:
        condition: service_healthy

  minio:
    # Оригинальный контейнер MinIO через стабильное зеркало [25]
    image: cr.yandex/mirror/minio/minio:latest
    container_name: bitlab_minio
    platform: linux/amd64
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin
    command: server /data --console-address ":9001"

  minio_create_bucket:
    # Оригинальный клиент автосоздания бакета [25]
    image: cr.yandex/mirror/minio/mc:latest
    container_name: bitlab_minio_init
    platform: linux/amd64
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 admin admin;
      /usr/bin/mc mb myminio/lms-files || true;
      /usr/bin/mc policy set public myminio/lms-files;
      exit 0;
      "

  main-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitlab_main_service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/lms_main_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: admin
      MINIO_BUCKET_NAME: lms-files
    depends_on:
      - postgres_db
      - minio